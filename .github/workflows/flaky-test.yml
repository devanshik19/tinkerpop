name: Confirm Flaky Test with NonDex

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  confirm-flaky:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build project
        run: mvn clean install -DskipTests -pl tinkergraph-gremlin -am

      - name: Run test WITHOUT NonDex (should PASS)
        run: mvn -pl tinkergraph-gremlin test -Dtest=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraphServiceTest#g_V_call_degree_centrality

      - name: Run test WITH NonDex (should FAIL - confirms flaky)
        run: mvn -pl tinkergraph-gremlin edu.illinois:nondex-maven-plugin:2.1.1:nondex -Dtest=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraphServiceTest#g_V_call_degree_centrality
